
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      background: #101820;
      color: white;
      font-family: Arial, sans-serif;
    }
    h2 { color: #65d9ff; margin-top: 0; }
    #chat {
      height: 220px;
      overflow-y: auto;
      background: #1b2835;
      padding: 10px;
      border-radius: 8px;
      white-space: pre-wrap;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 9px;
      border-radius: 6px;
      resize: vertical;
    }
    button {
      margin-top: 8px;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      background: #65d9ff;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
    }
    #status { color: #b8c8d8; font-size: 12px; }
  </style>
</head>
<body>
  <h2>JARVIS AI</h2>
  <p id="status">Interface ready — AI not connected</p>
  <div id="chat">JARVIS: Hello. I am ready to assist you.</div>
  <textarea id="question" rows="3"
    placeholder="Type your message..."></textarea>
  <button id="send">Send</button>
  <script src="popup.js"></script>
</body>
</html>
